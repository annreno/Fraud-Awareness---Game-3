<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Channel Reveal</title>
<style>
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; font-family:Arial,sans-serif; color:white; background:radial-gradient(circle,#12a7ff,#0874ef,#073dbd); display:flex; justify-content:center; align-items:center; padding:25px; }
.container { width:100%; max-width:1200px; }
h1 { background:#03166e; display:inline-block; padding:20px 25px; border-radius:15px; font-size:32px; font-weight:bold; font-style:italic; line-height:1.3; }
.highlight { color:#fff000; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; margin-top:30px; }
.card { border:none; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; }
.icon { width:140px; height:140px; border-radius:50%; background:var(--brand); display:flex; justify-content:center; align-items:center; box-shadow:0 8px 20px rgba(0,0,0,.2); border:3px solid rgba(255,255,255,.3); transition:transform .2s; }
.card:hover .icon { transform:scale(1.08); }
.question { font-size:85px; font-weight:bold; color:white; }
.symbol { display:none; font-size:65px; font-weight:bold; color:white; }
.label { margin-top:12px; min-width:180px; padding:12px; border-radius:8px; background:#134fc8; font-size:20px; font-weight:bold; text-align:center; }
.hidden-name { display:inline; }
.shown-name { display:none; color:#fff; }
.card.revealed .question { display:none; }
.card.revealed .symbol { display:inline; }
.card.revealed .icon { border:3px solid white; }
.card.revealed .hidden-name { display:none; }
.card.revealed .shown-name { display:inline; }
@media(max-width:700px) { .grid { grid-template-columns:repeat(2,1fr); } h1 { font-size:24px; } .icon { width:110px;height:110px;} }
</style>
</head>
<body>

</div>
<script>function reveal(card) { card.classList.toggle("revealed"); }</script>
</body>
</html>
